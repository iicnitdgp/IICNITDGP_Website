# All configuration comes from .env.docker at the repo root (client + server
# secrets in one place). Run with:
#   docker compose --env-file .env.docker up -d --build
#
# First-time HTTPS setup on a fresh server: run ./nginx/init-letsencrypt.sh
# once to bootstrap the Let's Encrypt certificate before nginx can serve 443.

services:
  redis:
    image: redis:7-alpine
    container_name: iic-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: iic-server
    env_file:
      - ./.env.docker
    expose:
      - "8000"
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BACKEND_URI: ${VITE_BACKEND_URI}
    container_name: iic-client
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: iic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - ./nginx/ssl-dhparams.pem:/etc/nginx/ssl-dhparams.pem:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - client
      - server
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: iic-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  redis-data:
  uploads-data:
  certbot-etc:
  certbot-www:
